plaid.client-id=replace-with-plaid-client-id
plaid.secret=replace-with-plaid-secret
plaid.environment=sandbox
plaid.token-encryption-key=replace-with-existing-encryption-key

app.cors.allowed-origins=http://localhost:5173

# Surepass sandbox
surepass.enabled=false
surepass.base-url=https://sandbox.surepass.app
surepass.bearer-token=replace-with-sandbox-token
surepass.document-directory=./data/surepass-reports
surepass.max-document-bytes=20971520
