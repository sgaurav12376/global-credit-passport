plaid.client-id=replace-with-plaid-client-id
plaid.secret=replace-with-plaid-secret
plaid.environment=sandbox
plaid.token-encryption-key=replace-with-existing-encryption-key

app.cors.allowed-origins=http://localhost:5173

# Surepass sandbox
surepass.enabled=false
surepass.base-url=https://sandbox.surepass.app
surepass.bearer-token=replace-with-sandbox-token
surepass.document-directory=./data/surepass-reports
surepass.max-document-bytes=20971520

# Finpass India multi-bureau API (never commit real credentials)
finpass.enabled=false
finpass.base-url=https://api.finpass.ai
finpass.api-key=replace-with-api-key
finpass.api-secret=replace-with-api-secret

# Entrust sandbox (never commit the real token)
entrust.enabled=false
entrust.base-url=https://api.us.onfido.com
entrust.api-token=replace-with-sandbox-token
entrust.workflow-id=replace-with-workflow-id

# Pilot only: Entrust submission/status is included in the passport but approval is non-blocking.
gcp.pilot.sandbox-identity-policy=true
